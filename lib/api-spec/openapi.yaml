openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: topics
    description: Controversial topic archive operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /topics:
    get:
      operationId: listTopics
      tags: [topics]
      summary: List and search archive topics
      description: Returns all controversial topics, optionally filtered by free-text search and category.
      parameters:
        - name: search
          in: query
          required: false
          description: Free-text search across title, summary, controversy, and tags.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter to a single category.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for results.
          schema:
            type: string
            enum: [title, category, recent]
      responses:
        "200":
          description: A list of topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topics/featured:
    get:
      operationId: listFeaturedTopics
      tags: [topics]
      summary: Featured / trending controversial topics
      description: Returns a curated subset of the most viral, debate-heavy topics for the archive landing experience.
      responses:
        "200":
          description: Featured topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topics/{slug}:
    get:
      operationId: getTopic
      tags: [topics]
      summary: Get a single topic by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /topics/{slug}/deep-dive:
    get:
      operationId: getTopicDeepDive
      tags: [topics]
      summary: Get the AI-generated deep dive for a topic
      description: >
        Returns an unverified AI-generated draft, including cached legacy dossiers.
        No source retrieval, verified citations or editorial review date is available.
        Public reads return prepared content only. They never start generation or write data.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The deep dive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepDive"
        "404":
          description: Topic not found or a dossier has not been prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: prepareTopicDeepDive
      tags: [topics]
      summary: Prepare a dossier through the disabled-by-default editor action
      description: >
        Requires the existing server editor key and ARCHIVE_EDITOR_GENERATION=enabled,
        plus an approved configured provider. Activation and resource-budget acceptance
        remain separate release gates. Preparation is coordinated by a shared database
        row lock; concurrent preparation on another instance returns 409. This endpoint
        is not invoked by public pages.
      security:
        - AdminKey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Existing or prepared unverified draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepDive"
        "401":
          description: Editor authorization required
        "404":
          description: Topic not found
        "409":
          description: Another instance is preparing this dossier; retry after it completes
        "503":
          description: Editor preparation disabled or unconfigured
  /topic-suggestions:
    get:
      operationId: listTopicSuggestions
      tags: [topics]
      summary: List pending topic suggestions for archive editors
      description: >
        Returns the private editorial queue, newest first. Requires a valid admin
        key in the x-admin-key header. Responses are private and must not be stored.
      security:
        - AdminKey: []
      responses:
        "200":
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSuggestion"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Admin moderation is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTopicSuggestion
      tags: [topics]
      summary: Suggest a new topic for the archive
      description: >
        Submits a visitor topic suggestion (title + why it's controversial).
        Suggestions land in a review queue and are not published automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicSuggestionInput"
      responses:
        "201":
          description: The created suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicSuggestion"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /topic-suggestions/{id}/approve:
    post:
      operationId: approveTopicSuggestion
      security:
        - AdminKey: []
      tags: [topics]
      summary: Approve a pending suggestion and publish it
      description: >
        Approves a pending topic suggestion, promoting it into the live archive
        by creating a real topic. Requires a valid admin key supplied via the
        `x-admin-key` request header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The published topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Suggestion is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /topic-suggestions/{id}/reject:
    post:
      operationId: rejectTopicSuggestion
      security:
        - AdminKey: []
      tags: [topics]
      summary: Reject a pending suggestion
      description: >
        Rejects a pending topic suggestion, removing it from the review queue.
        Requires a valid admin key supplied via the `x-admin-key` request header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The rejected suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicSuggestion"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Suggestion is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/verify:
    post:
      operationId: verifyAdminKey
      security:
        - AdminKey: []
      tags: [topics]
      summary: Verify an admin key
      description: >
        Validates the admin key supplied via the `x-admin-key` request header.
        Used to gate access to the moderation page. Returns 200 when the key is
        valid, 401 otherwise.
      responses:
        "200":
          description: The admin key is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerify"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Admin moderation is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    get:
      operationId: listCategories
      tags: [topics]
      summary: List categories with topic counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"
  /stats:
    get:
      operationId: getArchiveStats
      tags: [topics]
      summary: Archive-wide summary statistics
      responses:
        "200":
          description: Archive stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveStats"
components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: x-admin-key
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AdminVerify:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    Topic:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - summary
        - controversy
        - tags
        - featured
        - hasDeepDive
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        summary:
          type: string
          description: Short overview of the topic.
        controversy:
          type: string
          description: One or two sentences on why this topic is controversial / debated online.
        tags:
          type: array
          items:
            type: string
        era:
          type: ["string", "null"]
          description: Rough time period or origin of the topic.
        origin:
          type: ["string", "null"]
          description: Where this topic tends to trend (e.g. Reddit, YouTube, TikTok).
        imageUrl:
          type: ["string", "null"]
        featured:
          type: boolean
        hasDeepDive:
          type: boolean
          description: Whether an AI deep dive has already been generated and cached.
    Theory:
      type: object
      required:
        - title
        - explanation
        - plausibility
      properties:
        title:
          type: string
        explanation:
          type: string
        plausibility:
          type: string
          description: A short label for how plausible this theory is (e.g. Mainstream, Plausible, Fringe, Speculative).
        evidence:
          type: ["string", "null"]
          description: Model-generated rationale, not a verified citation.
    DeepDive:
      type: object
      required:
        - slug
        - research
        - theories
      properties:
        slug:
          type: string
        research:
          type: string
          description: Unverified AI-generated context in markdown; no retrieved citations or editorial review date.
        theories:
          type: array
          items:
            $ref: "#/components/schemas/Theory"
        verdict:
          type: ["string", "null"]
          description: A balanced closing assessment of where the truth likely lies.
    TopicSuggestionInput:
      type: object
      required:
        - title
        - controversy
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Proposed topic title.
        controversy:
          type: string
          minLength: 10
          maxLength: 2000
          description: Why the visitor thinks this topic is controversial / debated.
    TopicSuggestion:
      type: object
      required:
        - id
        - title
        - controversy
        - status
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        controversy:
          type: string
        status:
          type: string
          description: Review status of the suggestion (e.g. pending).
        createdAt:
          type: string
          format: date-time
    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer
    ArchiveStats:
      type: object
      required:
        - totalTopics
        - totalCategories
        - deepDivesGenerated
        - categories
      properties:
        totalTopics:
          type: integer
        totalCategories:
          type: integer
        deepDivesGenerated:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
